<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёплый список — подарки на Новый год</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f1e7;
            color: #234333;
            text-align: center;
        }

        header {
            background: #174b35;
            color: white;
            padding: 50px 20px;
        }

        h1 {
            font-size: 38px;
        }

        .content {
            padding: 40px 20px;
        }

        .gift-box {
            background: white;
            max-width: 400px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 18px;
        }

        button {
            background: #a52e3b;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎄 Тёплый список</h1>
        <p>Место, где собираются новогодние желания</p>
    </header>

    <main class="content">
        <h2>Подарки для всей семьи 🎁</h2>

        <div class="gift-box">
            <h3>Добро пожаловать!</h3>
            <p>Создайте свой список желаний и поделитесь им с семьёй.</p>
            <button>Мой список подарков</button>
        </div>
    </main>
</body>
</html>
