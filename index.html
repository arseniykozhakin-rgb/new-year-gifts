
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тёплый список — подарки на Новый год</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      color: #342d29;
    }

    header {
      padding: 28px 16px;
      text-align: center;
      background: #315b49;
      color: white;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p { margin: 0; }

    main {
      width: min(900px, 92%);
      margin: 28px auto;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px #0000000c;
    }

    h2 { margin-top: 0; }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 10px;
      font: inherit;
    }

    input, textarea {
      border: 1px solid #d8d1c8;
      background: #fffefa;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    button {
      border: 0;
      background: #315b49;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #244737; }

    button.secondary {
      background: #e9e3da;
      color: #342d29;
    }

    button.delete {
      width: auto;
      padding: 8px 13px;
      background: #a64d45;
      font-size: 13px;
    }

    .hidden { display: none !important; }

    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }

    .people button {
      width: auto;
      flex: 1 1 130px;
    }

    .gift {
      border: 1px solid #eee5da;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0;
      background: #fffefa;
    }

    .gift h3 { margin: 0 0 8px; }

    .gift img {
      display: block;
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 10px;
      margin: 10px 0;
    }

    .gift a {
      color: #315b49;
      overflow-wrap: anywhere;
    }

    .muted { color: #81776e; }

    #message {
      padding: 10px 0;
      color: #a64d45;
      white-space: pre-wrap;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topline button { width: auto; }
  </style>
</head>

<body>
  <header>
    <h1>🎄 Тёплый список</h1>
    <p>Семейный список желаний к Новому году</p>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h2>Вход в семейный список</h2>
      <p class="muted">Войди со своим email и паролем.</p>

      <input
        id="email"
        type="email"
        placeholder="Твой email"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="Общий пароль"
        autocomplete="current-password"
      >

      <button id="loginButton">Войти</button>
      <div id="message"></div>
    </section>

    <section id="appPanel" class="hidden">
      <div class="panel">
        <div class="topline">
          <div>
            <h2 id="welcome">Привет!</h2>
            <p class="muted">Выбери, чей список хочешь посмотреть.</p>
          </div>
          <button id="logoutButton" class="secondary">Выйти</button>
        </div>

        <div class="people">
          <button data-person="anya">Аня</button>
          <button data-person="arseniy">Арсений</button>
          <button data-person="matvey">Матвей</button>
          <button data-person="vitaliy">Виталий</button>
        </div>
      </div>

      <section class="panel">
        <h2 id="listTitle">Список желаний</h2>
        <p id="listDescription" class="muted"></p>
        <div id="gifts"></div>
      </section>

      <section id="addPanel" class="panel">
        <h2>Добавить желание</h2>
        <p class="muted">Новое желание добавится в твой личный список.</p>

        <input id="giftTitle" placeholder="Название подарка">
        <textarea id="giftDescription" placeholder="Описание или пожелания"></textarea>
        <input id="giftUrl" type="url" placeholder="Ссылка на подарок (необязательно)">
        <input id="giftImage" type="url" placeholder="Ссылка на картинку (необязательно)">

        <button id="addButton">Добавить в список</button>
        <div id="addMessage" class="muted"></div>
      </section>
    </section>
  </main>

  <script>
    // 1. НАСТРОЙКИ SUPABASE

    const SUPABASE_URL = "https://coghijubvxwnsmaozlgc.supabase.co";

    // Вставь сюда свой Publishable key из Supabase.
    // Не вставляй сюда Secret key.

    const SUPABASE_KEY = "ВСТАВЬ_СЮДА_СВОЙ_PUBLISHABLE_KEY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // 2. ЧЛЕНЫ СЕМЬИ

    const FAMILY = {
      "ms.kozhakina@gmail.com": {
        name: "Аня",
        slug: "anya"
      },

      "arseniy.kozhakin@gmail.com": {
        name: "Арсений",
        slug: "arseniy"
      },

      "mathew.kozhakin@gmail.com": {
        name: "Матвей",
        slug: "matvey"
      },

      "vk.answer33@gmail.com": {
        name: "Виталий",
        slug: "vitaliy"
      }
    };


    // 3. СОСТОЯНИЕ САЙТА

    let currentUser = null;
    let currentProfile = null;
    let currentListSlug = null;

    const loginPanel = document.getElementById("loginPanel");
    const appPanel = document.getElementById("appPanel");
    const message = document.getElementById("message");
    const giftsContainer = document.getElementById("gifts");


    // 4. ВХОД

    async function login() {
      message.textContent = "";

      const email = document.getElementById("email").value
        .trim()
        .toLowerCase();

      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.textContent = "Введи email и пароль.";
        return;
      }

      if (!FAMILY[email]) {
        message.textContent = "Этот email не добавлен в семейный список.";
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Не удалось войти: " + error.message;
        return;
      }

      currentUser = data.user;
      currentProfile = FAMILY[email];

      document.getElementById("welcome").textContent =
        "Привет, " + currentProfile.name + "!";

      loginPanel.classList.add("hidden");
      appPanel.classList.remove("hidden");

      openList(currentProfile.slug);
    }


    // 5. ВЫХОД

    async function logout() {
      await supabaseClient.auth.signOut();

      currentUser = null;
      currentProfile = null;
      currentListSlug = null;

      appPanel.classList.add("hidden");
      loginPanel.classList.remove("hidden");

      document.getElementById("password").value = "";
      message.textContent = "";
    }


    // 6. ОТКРЫТИЕ СПИСКА

    async function openList(slug) {
      currentListSlug = slug;

      const person = Object.values(FAMILY).find(
        item => item.slug === slug
      );

      if (!person) return;

      document.getElementById("listTitle").textContent =
        "Подарки для " + person.name;

      document.getElementById("listDescription").textContent =
        slug === currentProfile.slug
          ? "Это твой список. Ты можешь добавлять и удалять свои желания."
          : "Здесь можно посмотреть желания этого члена семьи.";

      const addPanel = document.getElementById("addPanel");

      if (slug === currentProfile.slug) {
        addPanel.classList.remove("hidden");
      } else {
        addPanel.classList.add("hidden");
      }

      await loadGifts(slug);
    }


    // 7. ЗАГРУЗКА ПОДАРКОВ

    async function loadGifts(slug) {
      giftsContainer.textContent = "Загружаем список...";

      const { data, error } = await supabaseClient
        .from("gifts")
        .select("*")
        .eq("owner_slug", slug)
        .order("created_at", { ascending: false });

      if (error) {
        giftsContainer.textContent =
          "Не удалось загрузить список: " + error.message;
        return;
      }

      giftsContainer.replaceChildren();

      if (!data || data.length === 0) {
        giftsContainer.textContent = "Пока здесь нет желаний.";
        return;
      }

      data.forEach(gift => {
        const card = document.createElement("article");
        card.className = "gift";

        const title = document.createElement("h3");
        title.textContent = gift.title || "Без названия";
        card.appendChild(title);

        if (gift.description) {
          const description = document.createElement("p");
          description.textContent = gift.description;
          card.appendChild(description);
        }

        if (gift.image_url && safeUrl(gift.image_url)) {
          const img = document.createElement("img");
          img.src = gift.image_url;
          img.alt = gift.title || "Подарок";
          img.loading = "lazy";
          card.appendChild(img);
        }

        if (gift.url && safeUrl(gift.url)) {
          const link = document.createElement("a");
          link.href = gift.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Открыть ссылку на подарок";
          card.appendChild(link);
        }

        if (gift.owner_id === currentUser.id) {
          const deleteButton = document.createElement("button");
          deleteButton.className = "delete";
          deleteButton.textContent = "Удалить";
          deleteButton.addEventListener("click", () => deleteGift(gift.id));
          card.appendChild(deleteButton);
        }

        giftsContainer.appendChild(card);
      });
    }


    // 8. ПРОВЕРКА ССЫЛОК

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }


    // 9. ДОБАВЛЕНИЕ ПОДАРКА

    async function addGift() {
      const title = document.getElementById("giftTitle").value.trim();
      const description = document.getElementById("giftDescription").value.trim();
      const url = document.getElementById("giftUrl").value.trim();
      const imageUrl = document.getElementById("giftImage").value.trim();
      const addMessage = document.getElementById("addMessage");

      addMessage.textContent = "";

      if (!title) {
        addMessage.textContent = "Напиши название подарка.";
        return;
      }

      if (url && !safeUrl(url)) {
        addMessage.textContent = "Проверь ссылку на подарок.";
        return;
      }

      if (imageUrl && !safeUrl(imageUrl)) {
        addMessage.textContent = "Проверь ссылку на картинку.";
        return;
      }

      const { error } = await supabaseClient
        .from("gifts")
        .insert({
          owner_id: currentUser.id,
          owner_slug: currentProfile.slug,
          title: title,
          description: description,
          url: url || null,
          image_url: imageUrl || null
        });

      if (error) {
        addMessage.textContent = "Ошибка: " + error.message;
        return;
      }

      document.getElementById("giftTitle").value = "";
      document.getElementById("giftDescription").value = "";
      document.getElementById("giftUrl").value = "";
      document.getElementById("giftImage").value = "";

      addMessage.textContent = "Желание добавлено!";
      await loadGifts(currentProfile.slug);
    }


    // 10. УДАЛЕНИЕ ПОДАРКА

    async function deleteGift(id) {
      const confirmed = confirm("Удалить это желание из списка?");
      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("gifts")
        .delete()
        .eq("id", id)
        .eq("owner_id", currentUser.id);

      if (error) {
        alert("Не удалось удалить: " + error.message);
        return;
      }

      await loadGifts(currentListSlug);
    }


    // 11. КНОПКИ

    document.getElementById("loginButton")
      .addEventListener("click", login);

    document.getElementById("logoutButton")
      .addEventListener("click", logout);

    document.getElementById("addButton")
      .addEventListener("click", addGift);

    document.querySelectorAll("[data-person]").forEach(button => {
      button.addEventListener("click", () => {
        openList(button.dataset.person);
      });
    });


    // 12. ПРОВЕРКА СОХРАНЁННОГО ВХОДА

    async function checkSession() {
      const { data } = await supabaseClient.auth.getSession();
      const user = data.session?.user;

      if (!user) return;

      const email = user.email?.toLowerCase();

      if (!FAMILY[email]) {
        await supabaseClient.auth.signOut();
        return;
      }

      currentUser = user;
      currentProfile = FAMILY[email];

      document.getElementById("welcome").textContent =
        "Привет, " + currentProfile.name + "!";

      loginPanel.classList.add("hidden");
      appPanel.classList.remove("hidden");

      await openList(currentProfile.slug);
    }

    checkSession();
  </script>
</body>
</html>
